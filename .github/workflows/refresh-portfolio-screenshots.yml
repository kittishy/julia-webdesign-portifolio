name: Refresh portfolio screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-portfolio-screenshots.yml"
      - "scripts/capture-portfolio-screenshots.mjs"
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture live Vercel sites
        run: node scripts/capture-portfolio-screenshots.mjs

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects/screenshots/*.png

          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi

          git commit -m "chore: refresh portfolio site screenshots"
          git push
